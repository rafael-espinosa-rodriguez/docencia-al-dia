<!doctype html>
<html class="dark" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Docencia al Día - Gestión Universitaria</title>
    <meta name="description" content="Sistema profesional para profesores: control de asistencia, evaluación de estudiantes y exportación a Excel." />
    <meta property="og:title" content="Docencia al Día - Gestión Universitaria" />
    <meta property="og:description" content="Sistema profesional para profesores: control de asistencia, evaluación de estudiantes y exportación a Excel." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#080d1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Docencia al Día" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        // El modo oscuro es el que se muestra por defecto
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#080d1a] text-slate-800 dark:text-slate-100 antialiased select-none touch-manipulation font-sans transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
