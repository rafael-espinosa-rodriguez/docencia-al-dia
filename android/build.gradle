// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Android Lint (lintVital, obligatorio en assembleRelease) rompe con rutas que
// contienen espacios: "Trailing char < > at index 22: D:/PROYECTOS NO BORRAR".
// Se desactiva solo la comprobación automática al compilar release; el lint
// completo sigue disponible con `gradlew lint`.
subprojects { p ->
    p.afterEvaluate {
        def androidExt = p.extensions.findByName('android')
        if (androidExt != null && androidExt.hasProperty('lint')) {
            androidExt.lint.checkReleaseBuilds = false
        }
    }
}
